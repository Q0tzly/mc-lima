# Lima VM configuration for mc-lima
# Runs a lightweight Alpine Linux VM with Docker and mounts the workspace.

minimumLimaVersion: 2.0.0

vmType: "vz"
vmOpts:
  vz:
    rosetta:
      enabled: true
      binfmt: true

cpus: 4
memory: "6GiB"
disk: "30GiB"

base:
  - template:alpine

mountType: "virtiofs"
mounts:
  - location: "~"
    writable: true

portForwards:
  - guestPort: 25565
    hostPort: 25565
    proto: tcp
  - guestPort: 25565
    hostPort: 25565
    proto: udp
  - guestPort: 25575
    hostPort: 25575
    proto: tcp

provision:
  - mode: system
    script: |
      #!/bin/sh
      set -eux
      apk update
      apk add docker docker-cli-compose
      rc-update add docker boot
      service docker start
      # Add default lima user to docker group
      addgroup "{{.User}}" docker

probes:
  - script: |
      #!/bin/sh
      set -eux
      command -v docker >/dev/null 2>&1
      docker info >/dev/null 2>&1
    hint: See cloud-init logs in guest
